# CI/CD for Astra.
#   Every push and pull request: run the tests (with a real Postgres) and build the Docker image.
#   Push to main, when both pass: deploy that exact commit to the EC2 server.
#
# The deploy uses AWS Systems Manager (SSM), not SSH, so the server keeps port 22
# closed to the internet. GitHub may only run one SSM document, AstraDeploy,
# which does nothing but deploy a commit on main. Credentials: OpenID Connect
# if AWS_DEPLOY_ROLE_ARN is set (short-lived, nothing stored), otherwise a
# restricted IAM user's access key (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY),
# for AWS plans where OIDC identity providers aren't available.
# Setup: deploy/CI_CD_SETUP.md
name: CI/CD

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astra -d astra_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://astra:astra@localhost:5432/astra_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # same as the Dockerfile
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile (catches syntax errors in files no test imports)
        run: python -m compileall -q astra cogs scripts main.py
      - run: pytest -v

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t astra:ci .

  deploy:
    name: Deploy to EC2
    needs: [test, docker]
    # Runs once the AWS side is set up and the DEPLOY_ENABLED variable is "true"
    # (deploy/CI_CD_SETUP.md); until then this job is skipped, not failed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # lets the job get short-lived AWS credentials (OIDC)
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false   # never interrupt a deploy halfway
    env:
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      USE_OIDC: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - name: AWS credentials (OIDC role)
        if: env.USE_OIDC == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - name: AWS credentials (restricted access key)
        if: env.USE_OIDC != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

      - name: Deploy this commit on the server (SSM document AstraDeploy)
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AstraDeploy \
            --comment "deploy ${GITHUB_SHA::7}" \
            --parameters "commit=$GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "SSM command: $command_id"

          # Wait up to 15 minutes (building the image on a micro instance takes a few).
          for _ in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 10 ;; *) break ;; esac
          done

          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "Deploy status: $status"
          test "$status" = "Success"
